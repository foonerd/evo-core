[package]
name = "evo-runtime-http"
description = "HTTPS runtime mount: binds an axum + rustls listener, mounts routes derived from the canonical projection schema, gates each route on capability-scoped bearer tokens, supports hot-reload of the cert bundle, and dispatches through a trait seam into the steward."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Hybrid post-quantum key exchange. Requires aws-lc-rs as the
# crypto provider (ring lacks ML-KEM-768). When enabled the
# server's TLS 1.3 handshake advertises X25519MLKEM768 first
# in its kx_groups list, falling back to the classical X25519
# group only when the client cannot negotiate the hybrid.
# The cert + signature path stays ed25519 — only key exchange
# is hybrid. Default off so cross-compile to ARM SBCs that
# lack a working cmake/nasm toolchain stays painless.
hybrid-pq = [
    "dep:aws-lc-rs",
    "rustls/aws-lc-rs",
    "rustls/prefer-post-quantum",
    "tokio-rustls/aws-lc-rs",
]

[dependencies]
async-trait = "0.1"
aws-lc-rs = { version = "1", optional = true }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
evo-projection-ws = { path = "../evo-projection-ws" }
base64 = "0.22"
bytes = "1"
# Captive-session proxy: decompress upstream gzip/deflate
# before HTML rewrite / JSON handoff. Portal-agnostic —
# UniFi, CoovaChilli, and most venue controllers compress
# JSON/API responses when the browser advertises
# Accept-Encoding.
flate2 = "1"
evo-auth-bearer = { path = "../evo-auth-bearer" }
evo-observatory = { path = "../evo-observatory" }
evo-plugin-sdk = { path = "../evo-plugin-sdk" }
evo-projection-core = { path = "../evo-projection-core" }
evo-projection-rest = { path = "../evo-projection-rest" }
evo-tls-certs = { path = "../evo-tls-certs" }
evo-witness = { path = "../evo-witness" }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
# Async ACME (RFC 8555) client. Pure Rust, hyper-rustls based;
# powers automatic Let's Encrypt issuance + renewal in
# `crate::acme`. HTTP-01 challenge tokens flow through the shared
# `AcmeChallengeStore` consumed by the redirect listener; issued
# certs land on the HotReloadCertResolver via its `swap` API.
instant-acme = "0.8"
# JWT validation powers the OIDC integration in `crate::oidc`.
# RSA + ES256 + Ed25519 are the algorithms OIDC providers
# advertise via JWKS; the crate's PKCS-DER decoders cover all
# three. reqwest (already in the graph) handles the JWKS fetch.
jsonwebtoken = { version = "10", default-features = false }
# `rustls-tls-native-roots` reads the system trust store so the
# OIDC verifier (and any other outbound TLS) can reach public IdPs
# (Google, Microsoft, Okta, Auth0, ...) without bundling a
# webpki-roots snapshot. `rustls-tls-manual-roots` is unusable here
# because that mode requires the caller to inject roots explicitly.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
notify = "6"
# rcgen powers CSR generation for ACME finalize. The framework
# already uses rcgen transitively via evo-tls-certs for device-CA
# leaf issuance; pulling it here directly makes the ACME-CSR use
# site explicit at the dependency level.
rcgen = { version = "0.13", default-features = false, features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Powers the artwork_resolve_index sidecar: SHA-256 of the
# (scheme, value, size) triple names the sharded file the
# (scheme, value, size) -> content_hash mapping is stored in.
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"

[dev-dependencies]
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }

[lints]
workspace = true
