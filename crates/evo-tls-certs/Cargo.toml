[package]
name = "evo-tls-certs"
description = "TLS certificate lifecycle substrate: device-CA generation, leaf issuance, PEM I/O, manual cert mode. The framework's HTTPS termination consumes the issued cert + private key; the cert is rotated on expiry by the runtime's renewal task."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evo-observatory = { path = "../evo-observatory" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
