schema_version: "1.0"
plugin: com.example.audio.source
owner: example-author
isolation: oop

# Set true when the plugin depends on any host-side OS package
# (binary, kernel module, system service). The compulsory
# parity gate at install-time and admission-time reads this
# field FIRST: true + a missing required_binary = HARD FAIL.
has_os_dependencies: false

# ARCHETYPE: audio_source
#
# A plugin that ingests audio from a local device or file (USB DAC,
# ALSA device, local library, tuner card) and exposes it through
# the framework's audio pipeline. Reads the shipped audio library
# and hands PCM (or a codec-tagged stream) to the framework's
# playback controller.
#
# TAILOR before shipping:
#   - `plugin` — replace with the reverse-DNS canonical id for
#     your plugin (e.g. `com.acme.tuner.dab`).
#   - `owner` — the accountable team / individual / organisation.
#   - `verification.commands` — read-only shell commands that
#     confirm the host actually satisfies the intents. Every entry
#     must exit 0 as the plugin's declared service identity.
#   - `host_provisioning.<distro>.systemd.SupplementaryGroups` —
#     the exact groups your source needs (typically `audio` plus
#     any device-node group). Reference-counted at uninstall.
#   - `host_provisioning.<distro>.systemd.ReadOnlyPaths` — narrow
#     to the media roots you actually read. Broad paths are
#     over-provisioning.

capability_intent:
  - id: audio_render
    need: emit PCM (or codec-tagged stream) to the framework's playback controller so the audio path can route it to output devices.
    access_path: alsa/render
    failure_mode: refuse to start audio session; structured event; no panic.
  - id: media_library_read
    need: read declared media library roots to enumerate available tracks and metadata for the framework's catalogue.
    access_path: filesystem/library
    failure_mode: report empty library; structured event names the unreachable root; no panic.
  - id: state_storage
    need: write per-plugin state directory (playback cursor, resume position, per-track statistics).
    access_path: filesystem/state
    failure_mode: degrade to no-state mode; structured event; no panic.

required_binaries: []

required_kernel_modules: []

required_system_services: []

verification:
  commands:
    - "test -d /var/lib/evo"
    - "test -r /var/lib/evo"
  expected:
    - state directory exists as the declared service identity
    - state directory is readable

host_provisioning:
  debian:
    systemd:
      SupplementaryGroups:
        - audio
      CapabilityBoundingSet: []
      AmbientCapabilities: []
      ProtectSystem: strict
      ProtectHome: "yes"
      ReadWritePaths:
        - /var/lib/evo/plugins/com.example.audio.source/state
      ReadOnlyPaths:
        - /var/lib/evo/music
      NoNewPrivileges: true
    capabilities: []
    sudoers: []
