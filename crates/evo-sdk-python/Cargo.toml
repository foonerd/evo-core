[package]
name = "evo-sdk-python"
description = "Python client SDK generator. Walks the canonical wire schema via evo-sdk-genkit and emits a multi-file Python package with typed per-domain classes, the top-level EvoClient, shared dataclasses, and a Transport ABC. The runtime mount writes the rendered file set under a Python package for PyPI publication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
evo-projection-core = { path = "../evo-projection-core" }
evo-sdk-genkit = { path = "../evo-sdk-genkit" }

[lints]
workspace = true
